name: AelornDiscordBridge
version: '4.0.0_26.2'
main: tw.linsy.aelorn.discordbridge.AelornDiscordBridgePlugin
description: DiscordSRV 的安全層：頻道白名單、綁定帳號要求、訊息過濾與雙向速率限制。
author: LinSy
api-version: '1.21'
folia-supported: true

# 4.0.0 拿掉了材質包同步與 InteractiveChat 整合。
#
# 理由不是「用不到」，是那半邊已經沒有對象了：實機 plugins\ 底下
# InteractiveChat、InteractiveChatDiscordSrvAddon、Oraxen 都只剩設定資料夾、
# jar 全不在，每次開機的稽核固定報兩則 failure；而 resource-pack.source
# 指向 Oraxen 的包，Oraxen 早已被 Nexo 取代。
#
# 也就是說 ResourcePackSynchronizer 在做的事是：把一個不存在的包，
# 複製給一個沒安裝的外掛。留著的代價不只是死程式碼 —— 稽核報告永遠有兩則紅字，
# 而永遠紅的警告等於沒有警告，會掩蓋掉真正該注意的那幾則。
#
# 舊的 website 欄位指向 DiscordSRV 官方倉庫，是複製貼上殘留，已移除。
# softdepend 的 InteractiveChat / Nexo / AeloriaHUD 與 loadbefore 同理：
# 它們存在只是為了材質包那條路徑。

depend:
  - DiscordSRV

commands:
  aelornbridge:
    aliases: [alb, adb]
    description: AELORN Discord bridge status and administration.
    usage: /aelornbridge <status|audit|reload>
    permission: aelorn.discordbridge.admin

permissions:
  aelorn.discordbridge.admin:
    description: Allows bridge status, audit, and reload commands.
    default: op
  aelorn.discordbridge.bypass:
    description: Bypasses Minecraft-side bridge rate limits.
    default: op
