config-version: 3

bridge:
  # 填你自己的 Discord 伺服器與頻道 ID。
  # 這三個是「訊息只准從這裡進出」的白名單，留空等於白名單失效 ——
  # 4.0.0 起留空會在稽核報告裡出現 WARN，不會再被誤報成 PASS。
  expected-guild-id: ""
  expected-channel-id: ""
  expected-console-channel-id: ""
  game-channel: "global"
  reject-unexpected-channel: true
  require-linked-discord-account: true

security:
  max-message-code-points: 256
  block-directional-control-characters: true
  block-mass-mentions: true
  attachments:
    max-count: 3
    max-file-size-bytes: 4194304

rate-limits:
  minecraft:
    window-seconds: 10
    max-messages: 6
  discord:
    window-seconds: 10
    max-messages: 8
  interactive-shares:
    max-placeholders-per-message: 2
    window-seconds: 30
    max-messages: 3

