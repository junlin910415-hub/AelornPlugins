  back-name: "&e« 返回"
  back-lore: []
  close-name: "&c關閉"
  close-lore: []
  next-page-name: "&e下一頁 »"
  prev-page-name: "&e« 上一頁"
  page-indicator: "&7第 {page} / {pages} 頁"
  balance-name: "&6你的{credit}"
  balance-lore:
    - "&f{symbol}{balance}"
    - ""
    - "&7VIP：&f{vip}"
    - "&8點擊查看訂單"
  confirm-yes-name: "&a&l確認購買"
  # 「購買後不可退換」必須出現在按下去的那顆按鈕上，只寫在條款頁不算事先告知。
  confirm-yes-lore:
    - "&7花費 &6{price}"
    - "&7餘額將剩 &6{after}"
    - ""
    - "&c&l購買後不可退換"
    - "&8按下即表示你已了解並同意"
  confirm-no-name: "&c&l取消"
  confirm-no-lore: []
  price-line: "&7價格：&6{price}"
  price-line-discounted: "&7價格：&m{original}&r &6{price} &a({percent}% off)"
  stock-line: "&7庫存：&f{stock}"
  limit-line: "&7限購：&f{bought}&7/&f{limit}"
  locked-line: "&c需要：{requirement}"
  click-to-buy: "&8點擊購買"

admin:
  usage-header: "{prefix}&f管理指令："
  usage-lines:
    - "&e/{label} reload &7— 重新載入設定與商品"
    - "&e/{label} status &7— 資料庫、金流、佇列狀態"
    - "&e/{label} credit <玩家> <give|take|set> <數量> [原因] &7— 調整儲值金"
    - "&e/{label} order <info|approve|cancel|refund> <訂單號> &7— 訂單處理"
    - "&e/{label} redeliver <訂單號> &7— 重新發貨"
    - "&e/{label} vip <set|clear> <玩家> [等級] [天數] &7— 手動設定 VIP"
    - "&e/{label} audit <玩家> [筆數] &7— 查詢稽核紀錄"
  status-header: "{prefix}&f系統狀態："
  status-lines:
    - "&7  資料庫：&f{storage} &7（{db_status}）"
    - "&7  商品：&f{products} &7項　分類：&f{categories}　VIP：&f{tiers} &7級"
    - "&7  金流管道：&f{providers}"
    - "&7  待付款：&f{pending} &7筆　待發貨：&f{awaiting} &7筆　待人工：&c{attention} &7筆"
  audit-header: "{prefix}&f{player} 的稽核紀錄（最近 {count} 筆）："
  audit-entry: "&8 • &7{time} &f{action} &7{detail}"
  audit-empty: "{prefix}&7查無稽核紀錄。"
