# ─────────────────────────────────────────────────────────────
#  shop.yml — 商店目錄與介面版面
# ─────────────────────────────────────────────────────────────
#  這個檔案是商品的唯一事實來源。新增商品不需要改程式、不需要重啟，
#  改完 /astore reload 即可。任何一項商品解析失敗只會被記錄並跳過，
#  不會讓整份目錄載入失敗。
#
#  ⚠ Mojang 商用準則：付費內容不得影響遊戲平衡（pay-to-win）。
#     安全範圍是外觀、稱號、名字顏色、寵物外觀、表情、稱號欄位。
#     下面的範例刻意全部走外觀 / 便利性，不含屬性與戰力。
# ─────────────────────────────────────────────────────────────

menu:
  # 主選單：列出分類。
  root:
    rows: 5
    # 背景填充物。填 NONE 或留白代表不填。
    filler: GRAY_STAINED_GLASS_PANE
    buttons:
      balance: 4
      topup: 40
      close: 44
  # 分類頁：列出該分類商品，超過格數自動分頁。
  category:
    rows: 6
    filler: BLACK_STAINED_GLASS_PANE
    # 商品格位。改這裡就等於改版面，程式不預設任何排列。
    content-slots: [10, 11, 12, 13, 14, 15, 16,
                    19, 20, 21, 22, 23, 24, 25,
                    28, 29, 30, 31, 32, 33, 34,
                    37, 38, 39, 40, 41, 42, 43]
    buttons:
      back: 45
      prev: 48
      balance: 49
      next: 50
      close: 53
  # 購買確認頁。
  confirm:
    rows: 3
    filler: GRAY_STAINED_GLASS_PANE
    item-slot: 13
    yes-slot: 11
    no-slot: 15
  # 儲值選單。
  topup:
    rows: 5
    filler: GRAY_STAINED_GLASS_PANE
    content-slots: [10, 11, 12, 13, 14, 15, 16,
                    19, 20, 21, 22, 23, 24, 25]
    buttons:
      back: 36
      balance: 40
      close: 44
  # 付款方式選擇頁（建立訂單後選管道）。
  provider:
    rows: 3
    filler: GRAY_STAINED_GLASS_PANE
    content-slots: [11, 12, 13, 14, 15]
    buttons:
      back: 18
      close: 26

