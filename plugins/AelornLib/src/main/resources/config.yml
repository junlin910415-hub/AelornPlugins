# ─────────────────────────────────────────────────────────────
# AelornLib — 艾洛恩共用函式庫
#
# 這支插件本身沒有任何遊戲功能。它只提供機制,讓其他艾洛恩插件共用:
#   平台識別 / 執行緒守衛 / 排程 / 文字格式 / 設定解析 / NMS 介接
#
# 這裡改一次,全站的艾洛恩插件一起生效。
# ─────────────────────────────────────────────────────────────

# 全站文字格式的預設值。個別插件仍可在自己的設定裡覆寫。
#   AUTO(預設)  含有 <標籤> 者以 MiniMessage 解析,否則視為 & 色碼
#   LEGACY      一律 & 色碼
#   MINIMESSAGE 一律 MiniMessage(<red>、<gradient:…> 等)
#   PLAIN       不處理格式
text-format: AUTO

region:
  # 區域執行緒守衛。
  #
  # Folia 系核心(LightingLuminol、Luminol、Folia)把世界切成 region 執行緒。
  # 從不擁有該區域的執行緒去碰世界狀態,不會丟例外 —— 會弄壞狀態或直接讓伺服器當機。
  # Paper 系核心(Purpur、Paper)只有單一 tick 執行緒,同一道檢查會變成「是不是主執行緒」,
  # 一樣正確,不需要改設定。
  #
  # 這道檢查現在完全走 Bukkit API(Bukkit.isOwnedByCurrentRegion),
  # 不依賴伺服器內部,所以在任何核心上都同樣準確。
  #
  #   STRICT(預設) 丟出 WrongRegionException。呼叫失敗遠好過世界壞掉,
  #                而且堆疊會直接指到寫錯的那一行。
  #   WARN         每個呼叫點只記一次 log 後放行。正式服不想因為一個錯誤呼叫
  #                就讓整個功能掛掉時用。
  #   OFF          完全不檢查。只有在實測過這道檢查是瓶頸時才用(它只是一次 API 呼叫)。
  thread-guard: STRICT

nms:
  # 伺服器內部能力的解析層,依序嘗試,先取到的優先。
  # 每個能力各自解析,所以同一台伺服器同時用到多層是正常的。
  #
  #   ADAPTER  對「這一版伺服器核心」直接編譯的 adapter。最快,但換版可能失效。
  #   HANDLE   啟動時以 MethodHandle 綁定。速度接近 ADAPTER,且換版通常還能用。
  #            這一層是「沒有對應 adapter 的核心也能全速跑」的關鍵。
  #   REFLECT  純反射。較慢,只在 HANDLE 綁不上時補位。
  #   API      純 Bukkit API,永遠可用,不受版本影響。無法關閉。
  #
  # 這是逃生門,不是調校項目:正常情況請維持四層全開。
  # 想確認某個行為差異是哪一層造成的,就把上層拿掉重啟,再跑 /aelornlib nms 比對。
  #
  # 註:改這裡需要重新啟動才會生效 —— 能力函式在啟用時就發給依賴插件了,
  #     執行期抽換會讓兩個呼叫端對同一個問題拿到不同答案。
  strategies:
    - ADAPTER
    - HANDLE
    - REFLECT
    - API

packet:
  # 封包管線的提供者。這裡是「允許清單」,不是順序 —— 實際優先順序固定為下面的排列,
  # 核心取第一個真的可用的。
  #
  #   AELORN         核心自建,不需要安裝任何函式庫。是唯一能做到這些的:
  #                  · 封包型別名直接從伺服器自己的類別推導,不靠任何人維護的對照表
  #                  · PacketStructure 讀寫封包欄位(record 封包會自動重建)
  #                  · PacketFactory 用型別名建構封包
  #                  · bundle 會被展開,裡面的封包各自進到監聽器
  #                  · 從登入的第一個封包就開始攔截,而不是等玩家進到伺服器
  #   PACKET_EVENTS  封包型別跨版本正規化。沒有欄位存取 —— 它讀的是位元組緩衝,
  #                  沒有封包物件可以交出來。
  #   PROTOCOL_LIB   型別較貼近伺服器本身的形狀,有欄位存取。
  #
  # 三個都不可用(或這裡留空)時:送包、廣播照常運作(走核心 NMS),
  # 只有「攔截封包」與「注入客戶端封包」會停用,並在啟動日誌指名。
  #
  # 換提供者不需要改任何插件 —— 三個後端吃同一組型別名(含兩個函式庫的舊拼法)。
  #
  # 留空是逃生門:想確認某個問題是不是封包層造成的,就清空這裡重啟。
  providers:
    - AELORN
    - PACKET_EVENTS
    - PROTOCOL_LIB

data:
  # 資料庫查詢跑在哪種執行緒。
  #
  # true(預設):虛擬執行緒。JDBC 是阻塞式的,虛擬執行緒讓「阻塞」幾乎不花成本,
  #            所以不需要調執行緒池大小 —— 真正的上限是連線池,那才是該設上限的地方。
  #            Java 25 起 synchronized 區塊內阻塞不再釘住載體執行緒(JEP 491),
  #            而 JDBC 驅動裡到處是 synchronized,所以這在 25 上才真正安全。
  # false:     改用固定大小的平台執行緒池。這是逃生門 ——
  #            懷疑虛擬執行緒造成問題時用來排除,不是效能選項。
  virtual-threads: true

  # 只有 virtual-threads: false 時才有意義。
  platform-pool-size: 8

store:
  # 文件儲存層（core.stores()）。這裡只有一個全站設定:YAML 後端把寫入合併起來,
  # 每隔這麼多秒才真的落磁碟一次。
  #
  # 調小 = 當機時損失較少,但檔案 I/O 較頻繁;調大 = 反之。
  # 正常關機與插件卸載一定會寫回,這個設定只影響「被 kill 掉」的情境。
  #
  # 各個儲存區要用哪個後端(YAML / SQL / MONGODB / MEMORY)是各插件自己的設定,
  # 不在這裡 —— 因為那是「這份資料放哪」的決定,每份資料可以不一樣。
  flush-seconds: 30
