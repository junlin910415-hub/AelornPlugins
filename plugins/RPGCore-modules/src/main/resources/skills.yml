  # ══════════════════════════════════════════════════════════════
  #  三、奧義 ULTIMATE — 高耗長冷卻，決定戰局的一擊
  # ══════════════════════════════════════════════════════════════

  # 08 ── 天譴雷罰（法杖／聖器）
  # 一秒前搖，對手看得見閃電預兆。命中範圍大、傷害高。
