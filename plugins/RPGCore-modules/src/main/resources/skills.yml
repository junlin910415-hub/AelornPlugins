        spread: 1.2
      - delay: 0
        mechanic: DAMAGE
        targeter: LINE
        radius: 0.8
        range: 18.0
        max-targets: 4
        amount: 0.75
      - delay: 0
        mechanic: AURA
        targeter: SELF
