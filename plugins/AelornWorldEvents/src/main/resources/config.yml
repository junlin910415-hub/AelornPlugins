# ─────────────────────────────────────────────────────────────
# AelornWorldEvents — 玩家接近觸發的野外遭遇
#
# 遭遇本身由 RPGCore 生成;這支插件只負責「什麼時候、在哪裡、觸發哪一個」。
# 接近判定由玩家移動事件驅動(Folia 沒有全服統一 tick 可以掃全部玩家)。
#
# 文字全部在 messages.yml。改完執行 /awe reload(非同步)。
# ─────────────────────────────────────────────────────────────

# 沿用舊版的欄位標記,目前僅供辨識,不影響載入。
schema-version: 1

settings:
  enabled: true

  # 同一位玩家每隔多少 tick 才做一次接近判定。數字越小越即時、成本越高。
  check-interval-ticks: 20

  # 事件未自訂 activation-radius 時的預設觸發半徑(格)。
  activation-radius: 96.0

  # 事件啟動後對多遠的玩家廣播。小於 activation-radius 會自動提高到相同值,
  # 否則觸發事件的本人反而收不到通知。
  announce-radius: 1200.0

  # 全服與單一 region 同時進行的事件數上限。
  maximum-active-global: 3
  maximum-active-per-region: 1

  # 線上人數低於此值就不觸發。
  minimum-online-players: 1

  # 一個事件啟動後,算「進行中」多久(佔用上述名額)。
  active-window-seconds: 600

  # 啟動指令被拒絕時,最多多久後可以重試。
  # 讓失敗的節點不必空等完整 cooldown。
  dispatch-failure-cooldown-seconds: 60

  # 空間索引的格子邊長(格)。查詢只掃 3x3 鄰域,
  # 所以這個值要明顯大於最大的 activation-radius。
  spatial-grid-size: 256

  # 交給 RPGCore 的啟動指令。
  # 可用佔位符:{encounter} {event} {region} {world} {x} {y} {z} {level}
  start-command: rpg encounter startat {encounter} {world} {x} {y} {z} {level}

  # 啟動時檢查上面的指令是否包含這些佔位符,缺少就在 console 警告。
  # 設成 [] 可完全關閉這項檢查。
  start-command-tokens: ['{encounter}', '{world}', '{x}', '{y}', '{z}', '{level}']

# ─────────────────────────────────────────────────────────────
# 事件節點。
#   id            — 區段名稱,只能用小寫英數、底線、連字號
#   display-name  — 廣播用名稱,可含顏色碼
#   region        — 用於 maximum-active-per-region 的分組
#   encounter     — 傳給 RPGCore 的遭遇 id
#   location      — world / x / y / z
#   level         — 遭遇等級
#   cooldown-minutes    — 這個節點自己的冷卻
#   activation-radius   — 覆寫預設觸發半徑(選填)
#
# 單一節點設定錯誤只會略過該節點並在 console 說明原因,
# 其餘事件照常載入。
# ─────────────────────────────────────────────────────────────
