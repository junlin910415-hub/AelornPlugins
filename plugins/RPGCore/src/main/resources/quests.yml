schema-version: 4

# ─────────────────────────────────────────────────────────────
# schema 4 新增:
#   stages:  多階段任務。玩家一次只看到目前這一步,完成後才揭露下一步。
#            與扁平的 objectives 二擇一,兩者同時寫會被判為設定錯誤。
#   rewards: 結構化獎勵(經驗 / 物品 / 專業經驗)。
#            舊的 reward-experience 仍然有效,沒寫 rewards 時自動沿用。
#
# 目標類型:
#   KILL_MONSTER       target = 怪物 id
#   COMPLETE_ENCOUNTER target = 遭遇 id
#   DISCOVER_LOCATION  target = 發現 id
#   COLLECT_ITEM       target = 類型:物品 id
#   TALK_TO_NPC        target = NPC id
#   USE_ITEM           target = 類型:物品 id            (右鍵使用,只認主手)
#   DELIVER_ITEM       target = NPC id/類型:物品 id     (會消耗背包物品)
#   CAST_ABILITY       target = 技能 id
#   REACH_LEVEL        target = 等級數字                (接受任務與升級時檢查)
# ─────────────────────────────────────────────────────────────

# Original clean-room quest chain for the current monster and encounter roster.
quests:
  road_patrol:
    display-name: '<green>荒路巡查</green>'
    description: '商道附近的掠奪者正在試探防線，先削弱他們的斥候。'
    category: SIDE
    icon: CROSSBOW
    minimum-level: 3
    prerequisites: []
    reward-experience: 90
    objectives:
      clear_scouts:
        type: KILL_MONSTER
        target: roadside_raider
        amount: 5
        description: '擊敗荒路掠奪者'

  frontline_supplies:
    display-name: '<yellow>前線補給</yellow>'
    description: '軍需官需要回收荒路武器上的魔力粉塵，才能修復下一批裝備。'
    category: SIDE
    icon: GLOWSTONE_DUST
    minimum-level: 5
    prerequisites: [road_patrol]
    reward-experience: 140
    objectives:
      report_to_quartermaster:
        type: TALK_TO_NPC
        target: RPGCore_Quartermaster
        amount: 1
        description: '與灰岸軍需官交談'
      gather_weapon_powder:
        type: COLLECT_ITEM
        target: MATERIAL:WEAPON_POWDER
        amount: 3
        description: '取得武器粉塵'

  broken_blockade:
    display-name: '<gold>擊破封鎖線</gold>'
    description: '斥候只是前鋒。深入商道，瓦解完整的封鎖隊伍。'
    category: STORY
    icon: IRON_SWORD
    minimum-level: 3
    prerequisites: [road_patrol]
    reward-experience: 180
    objectives:
      finish_roadblock:
        type: COMPLETE_ENCOUNTER
        target: raider_roadblock
        amount: 1
        description: '完成荒路封鎖線遭遇戰'

  ember_warning:
    display-name: '<gold>餘燼警訊</gold>'
    description: '焦黑徽記指向一群操縱餘火的施法者，查明他們的戰鬥方式。'
    category: STORY
    icon: BLAZE_POWDER
    minimum-level: 13
    prerequisites: [cartographers_trace]
    reward-experience: 360
    objectives:
      defeat_adepts:
        type: KILL_MONSTER
        target: ember_adept
        amount: 5
        description: '擊敗燼火學徒'

  cartographers_trace:
    display-name: '<aqua>製圖師的軌跡</aqua>'
    description: '封鎖線留下半張測繪圖。沿著商路地標找出灰燼觀測站。'
    category: EXPLORATION
    icon: FILLED_MAP
    minimum-level: 8
    prerequisites: [broken_blockade]
    reward-experience: 260
    objectives:
      locate_observatory:
        type: DISCOVER_LOCATION
        target: ashen_observatory
        amount: 1
        description: '發現灰燼觀測站'
      clear_remaining_scouts:
        type: KILL_MONSTER
        target: roadside_raider
        amount: 3
        description: '清除沿途的荒路掠奪者'

  silence_the_ritual:
    display-name: '<red>熄滅儀式</red>'
    description: '施法者正聚集守衛與吟唱者。突破三重防線，中止共鳴。'
    category: DUNGEON
    icon: FIRE_CHARGE
    minimum-level: 13
    prerequisites: [ember_warning]
    reward-experience: 650
    objectives:
      finish_ritual:
        type: COMPLETE_ENCOUNTER
        target: ember_ritual
        amount: 1
        description: '完成餘燼儀式遭遇戰'

  resonant_fragments:
    display-name: '<aqua>林間共鳴</aqua>'
    description: '遺跡外圍出現會治療同伴的吟唱者，取得足夠戰鬥紀錄。'
    category: EXPLORATION
    icon: FLOWERING_AZALEA
    minimum-level: 20
    prerequisites: [silence_the_ritual]
    reward-experience: 780
    objectives:
      study_chanters:
        type: KILL_MONSTER
        target: grove_chanter
        amount: 3
        description: '擊敗林地吟唱者'

  final_watch:
    display-name: '<light_purple>鎮守者終局</light_purple>'
    description: '所有線索都通往失序遺跡。完成試煉，終止鎮守者的循環。'
    category: CHALLENGE
    icon: ECHO_SHARD
    minimum-level: 28
    prerequisites: [resonant_fragments]
    reward-experience: 2500
    objectives:
      locate_vault:
        type: DISCOVER_LOCATION
        target: echo_vault
        amount: 1
        description: '發現回聲秘庫'
      finish_trial:
        type: COMPLETE_ENCOUNTER
        target: ruin_trial
        amount: 1
        description: '完成失序遺跡試煉'

  # ── 多階段任務範例(schema 4)──────────────────────────────
  # 三個步驟依序推進;玩家在日誌只看得到目前那一步。
  ashen_investigation:
    display-name: '<gold>灰燼調查</gold>'
    description: '灰燼派的活動不像流寇作亂，追查下去。'
    category: STORY
    icon: SPYGLASS
    minimum-level: 10
    prerequisites: [ember_warning]
    stages:
      gather_evidence:
        description: '在灰燼觀星臺找到他們留下的痕跡。'
        objectives:
          reach_observatory:
            type: DISCOVER_LOCATION
            target: ashen_observatory
            amount: 1
            description: '抵達灰燼觀星臺'
          silence_adepts:
            type: KILL_MONSTER
            target: ember_adept
            amount: 6
            description: '肅清灰燼修士'
      report_findings:
        description: '把發現帶回去給軍需官。'
        objectives:
          deliver_powder:
            type: DELIVER_ITEM
            target: 'RPGCore_Quartermaster/MATERIAL:WEAPON_POWDER'
            amount: 8
            description: '向軍需官交付魔力粉塵'
      prove_readiness:
        description: '在出發前確認自己撐得住。'
        objectives:
          be_strong_enough:
            type: REACH_LEVEL
            target: '14'
            amount: 1
            description: '角色等級達到 14'
    rewards:
      experience: 850
      items:
        - material: DIAMOND
          amount: 3
          name: '<aqua>調查報酬</aqua>'
        - material: GOLDEN_APPLE
          amount: 2
      profession-experience:
        # 專業 id 需與 professions 設定一致
        alchemy: 200
