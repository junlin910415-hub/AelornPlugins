schema-version: 1

# ═══════════════════════════════════════════════════════════════
#  艾洛恩 AELORN — 職業資源設定
# ═══════════════════════════════════════════════════════════════
#
#  「資源」是施放技能要付出的代價。法師燒法力、戰士攢怒氣、
#  盜賊靠精力與連擊點，各職業的節奏差異就是從這裡長出來的。
#
#  新增一種資源只要在 types 底下補一段，程式完全不必改動。
#
# ───────────────────────────────────────────────────────────────
#  行為模式 behavior
# ───────────────────────────────────────────────────────────────
#  REGENERATE  自動回復 — 平時穩定回升至上限，戰鬥中可調降速度。
#              適合：法力、精力
#  DECAY       戰鬥累積 — 脫離戰鬥後隨時間消退回起始值。
#              適合：怒氣、戰意
#  STATIC      靜止     — 完全不自動變動，只受技能與道具影響。
#              適合：連擊點、專注層數
#
# ───────────────────────────────────────────────────────────────
#  欄位說明
# ───────────────────────────────────────────────────────────────
#  name                      顯示名稱
#  symbol                    HUD 與選單用的符號
#  color                     顏色代碼（& 開頭）
#  behavior                  行為模式，見上方說明
#  max.base                  等級 1 的上限
#  max.per-level             每升一級增加的上限
#  regen-per-second          每秒回復量（REGENERATE 專用）
#  combat-regen-multiplier   戰鬥中的回復倍率，0.4 代表打四折
#  decay-per-second          脫戰後每秒消退量（DECAY 專用）
#  start-ratio               上線與重生時的初始比例，0.0 為空、1.0 為滿
#  order                     HUD 排序，數字小的排前面
#  classes                   限定職業；留空或省略代表所有職業共用
#
# ═══════════════════════════════════════════════════════════════

# 每隔幾 tick 結算一次資源。20 = 每秒一次，數字越小越即時但越吃效能。
tick-period-ticks: 20

types:

  # ── 法力 ─────────────────────────────────────────────────────
  # 施法職業的核心資源。平時穩定回復，但戰鬥中只剩四成速度，
  # 逼玩家在「連續輸出」與「留一手保命」之間做取捨。
  mana:
    name: "法力"
    symbol: "✦"
    color: "&b"
    behavior: REGENERATE
    max:
      base: 100
      per-level: 5
    regen-per-second: 3.0
    combat-regen-multiplier: 0.4
    start-ratio: 1.0
    order: 1

  # ── 怒氣 ─────────────────────────────────────────────────────
  # 越打越多，脫戰後迅速消退。上線時歸零，逼戰士靠交火起手，
  # 而不是站在安全處攢滿再開怪。
  rage:
    name: "怒氣"
    symbol: "✸"
    color: "&c"
    behavior: DECAY
    max:
      base: 100
      per-level: 0
    decay-per-second: 5.0
    start-ratio: 0.0
    order: 2
    classes:
      - vanguard      # 戰士

  # ── 精力 ─────────────────────────────────────────────────────
  # 回復快、上限低，適合高頻率的短促技能。
  # 戰鬥中不減速，讓靈巧職業能維持連續動作。
  stamina:
    name: "精力"
    symbol: "❖"
    color: "&a"
    behavior: REGENERATE
    max:
      base: 80
      per-level: 2
    regen-per-second: 8.0
    combat-regen-multiplier: 1.0
    start-ratio: 1.0
    order: 3
    classes:
      - shadowblade   # 刺客
      - ranger        # 弓箭手

  # ── 連擊點 ───────────────────────────────────────────────────
  # 只由技能給予與消耗，不會自己增減。
  # 上限五點，作為終結技的開關。
  combo:
    name: "連擊點"
    symbol: "◆"
    color: "&e"
    behavior: STATIC
    max:
      base: 5
      per-level: 0
    start-ratio: 0.0
    order: 4
    classes:
      - shadowblade   # 刺客
