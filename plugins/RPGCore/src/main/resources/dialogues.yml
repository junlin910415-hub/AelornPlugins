# ─────────────────────────────────────────────────────────────
# 艾洛恩 — NPC 對話劇情
#
# 每段對話綁定一個 MythicMobs NPC id。玩家右鍵該 NPC 時,若此處有對應對話,
# 就會播放對話而不是立即完成 TALK_TO_NPC 目標;任務進度改由節點的
# grant-quest-progress 決定,設計者能控制「講到哪一句才算談過話」。
#
# 沒有在這裡定義的 NPC 維持原本行為(右鍵即回報進度)。
#
# 演出說明:
#   - 台詞逐句送到聊天欄,不會洗頻
#   - 標記 typewriter 的句子會在動作列逐字浮現(動作列原地更新,適合這種效果)
#   - lock-movement 期間玩家不能走動但可以轉頭看 NPC,也不會被怪打死
#   - 蹲下即可跳過(skippable: false 的對話除外)
# ─────────────────────────────────────────────────────────────
schema-version: 1

dialogues:

  # 對應 quests.yml 的 frontline_supplies → report_to_quartermaster 目標
  quartermaster_briefing:
    npc: quartermaster
    speaker: '<gold>軍需官 賽拉</gold>'
    start: greeting
    lock-movement: true
    skippable: true
    nodes:

      greeting:
        lines:
          - '你來得正好，旅人。'
          - text: '荒路上的掠奪者……他們不只是流寇了。'
            typewriter: true
            pause: 10
        choices:
          - text: '我能幫上什麼忙？'
            next: request
          - text: '為什麼說他們不只是流寇？'
            next: lore
          - text: '（保持沉默）'
            next: farewell

      lore:
        lines:
          - '他們的武器上有魔力粉塵的殘留。'
          - '那種東西不會出現在普通匪徒手上。'
        next: request

      request:
        lines:
          - '我需要那些粉塵，才能修好下一批裝備。'
          - '去把它們帶回來，前線就靠這個撐著。'
        # 講到這裡才算完成「向軍需官回報」的任務目標
        grant-quest-progress: true
        choices:
          - text: '交給我。'
            next: accepted
          - text: '我得先準備一下。'
            next: farewell

      accepted:
        lines:
          - text: '好樣的。路上小心，別讓他們發現你的來意。'
            pause: 20
        # 沒有 choices 也沒有 next,對話在此結束

      farewell:
        lines:
          - '有需要隨時回來找我。'

  # 只在玩家已持有 road_patrol 任務時才會觸發的補充對話
  scout_warning:
    npc: frontier_scout
    speaker: '<aqua>斥候 凱恩</aqua>'
    start: warn
    lock-movement: false
    skippable: true
    required-quest: road_patrol
    nodes:
      warn:
        lines:
          - '你也是去清剿掠奪者的？'
          - '小心他們的頭目——別單獨行動。'
        choices:
          - text: '謝了，我會注意。'
            next: bye
          - text: '你見過那個頭目？'
            next: detail
            # 條件不符時直接隱藏,劇情選項這樣比較自然
            minimum-level: 8
            hidden-when-locked: true
      detail:
        lines:
          - '見過一次。他身上帶著不屬於這片荒地的東西。'
        next: bye
      bye:
        lines:
          - '活著回來。'
