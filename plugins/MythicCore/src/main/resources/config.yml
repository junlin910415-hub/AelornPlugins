    element-defense-weight: 2.35
    magic-resistance-cap: 0.78
    element-resistance-cap: 0.74
    dodge-cap: 35.0
    parry-cap: 45.0
    block-cap: 55.0
    default-critical-power: 170.0
    vanilla-damage-weight: 0.32
    weapon-bonus: 1.04
    magic-bonus: 0.95
    element-bonus: 0.86
    combo-scalar-cap: 2.45

