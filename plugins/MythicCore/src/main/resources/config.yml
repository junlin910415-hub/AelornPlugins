profile:
  welcome-summary: true

integration:
  rpgcore:
    # 每次啟用或 /mythiccore reload 時唯讀同步 RPGCore 的最新職業與技能資料。
    enabled: true
    data-folder: RPGCore
    import-classes: true
    import-abilities: true
    # 快取角色檔並監聽施法事件，職業與等級限制會使用目前角色資料。
    player-profile-sync: true
    prefer-mythiccore-stage-names: true
    # RPGCore 原始係數以執行器為基準；匯入 API 時先縮放，避免與裝備傷害重複放大。
    ability-coefficient-scale: 0.55

combat:
  enabled: true
  actionbar-indicators: true
  minimum-damage: 0.5
  ability-cooldown-ms: 450
  formula:
    defense-k: 105.0
    resistance-k: 95.0
    damage-weight: 2.55
    defense-cap: 0.82
    resistance-cap: 0.76
