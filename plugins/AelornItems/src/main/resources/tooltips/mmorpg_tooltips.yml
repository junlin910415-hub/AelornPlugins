# ─────────────────────────────────────────────────────────────
# 艾洛恩 — 物品提示樣式(Wynncraft 風格)
#
# 與舊版的差別:
#   分隔線  整排刪除線 &m------ → 中央帶菱形的細線 ◇──────◇
#           整排刪除線在長 lore 上很吵,菱形細線是 Wynncraft 的視覺語彙
#   標頭    「稀有度 - 類型」→ 全大寫徽章「RARE HELMET」
#
# 佔位符:{tier} 稀有度顯示名、{type} 物品類型
#
# top    第一頁開頭
# middle 區塊之間
# bottom 每頁結尾(翻頁指示之前)
# ─────────────────────────────────────────────────────────────

STARTER:
  top: '&8◇──────────────◇'
  middle: '&8◇──────────────◇'
  bottom: '&8◇──────────────◇'
  lore_header:
    - '&8{tier} &8{type}'

