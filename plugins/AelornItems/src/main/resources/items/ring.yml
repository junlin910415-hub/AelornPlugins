# 戒指（RING）— 前 30 級
#
# 設計原則：
# 1. 飾品共有四格（戒指×2、手鐲、項鍊），單件數值必須保守，
#    否則四格疊加會直接壓過武器與防具的權重。
#    每件的定位是「小幅補強一個面向」，不是主力輸出來源。
# 2. 不給 attack-damage / armor 這類主屬性，避免與武器防具搶位置；
#    改給 rating、百分比與資源類，讓飾品成為「調整取向」而非「堆數值」。
# 3. 兩個戒指欄可放同一件，因此不設套裝，避免雙倍套裝加成。

