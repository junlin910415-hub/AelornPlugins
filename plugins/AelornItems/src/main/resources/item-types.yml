# ═══════════════════════════════════════════════════════════════
#  圖鑑分類
# ═══════════════════════════════════════════════════════════════
#
#  /mi browse 首頁的分類頁籤。原本寫死在 Java 裡，新增一種武器類型
#  或把某個類型換一個分類都得重新編譯，現在改這裡就好。
#
#  ⚠ 順序有意義：比對是由上到下、第一個命中就採用。
#    近戰寫在遠程前面，GREATSWORD 才會先命中 SWORD 關鍵字歸入近戰。
#    把遠程搬到最前面，所有含 BOW/STAFF 的類型就會改歸遠程。
#
#  欄位：
#    id          分類代號，可被 item-types 的 category 欄位指名
#    display     顯示名稱（含 & 色碼）
#    icon        頁籤圖示的 Minecraft 材質；打錯只會退回 PAPER，不會讓分類消失
#    description 頁籤上的說明文字
#    types       精確比對的物品類型（完全相等才算）
#    keywords    模糊比對的關鍵字（類型名「包含」它就算）
#
#  整段刪掉或全部寫壞時，沿用程式內建的五大分類。
#

browser-categories:

  - id: MELEE
    display: '&c近戰武器'
    icon: DIAMOND_SWORD
    description: '劍、大劍、斧、匕首、長矛'
    types: [SWORD, GREATSWORD, LONG_SWORD, THRUSTING_SWORD, KATANA, DAGGER,
            SPEAR, LANCE, HALBERD, AXE, GREATAXE, HAMMER, GREAT_HAMMER,
            GREATHAMMER, GAUNTLET, WHIP]
    keywords: [SWORD, DAGGER, SPEAR, AXE, HAMMER, LANCE, GAUNTLET, WHIP]

  - id: RANGED
    display: '&d遠程・法器'
    icon: BOW
    description: '弓、弩、法杖、聖器'
    types: [BOW, GREATBOW, CROSSBOW, MUSKET, STAFF, GREATSTAFF, WAND, TOME,
            LUTE, CATALYST, MAIN_CATALYST, OFF_CATALYST]
    keywords: [BOW, STAFF, WAND, TOME, CATALYST, MUSKET, LUTE]

  - id: ARMOR
    display: '&b防具'
    icon: IRON_CHESTPLATE
    description: '頭盔、胸甲、護腿、靴子、盾牌'
    types: [ARMOR, HELMET, CHESTPLATE, LEGGINGS, BOOTS, SHIELD, GLOVES]
    keywords: [ARMOR, HELMET, CHEST, LEGGING, BOOT, SHIELD, GLOVE]

  # 飾品從「強化・寶石」獨立出來：戒指護符是穿戴裝備，
  # 放在強化材料頁會讓玩家去翻錯的分頁。
  - id: TRINKET
    display: '&e飾品'
    icon: GOLD_INGOT
    description: '戒指、護符、手鐲與其他配飾'
    types: [RING, AMULET, BRACELET, TALISMAN, ORNAMENT, ACCESSORY, ARTIFACT]
    keywords: [RING, AMULET, BRACELET, TALISMAN, ORNAMENT, ACCESSORY, ARTIFACT]

  - id: ENHANCE
    display: '&6強化・寶石'
    icon: AMETHYST_SHARD
    description: '寶石、符文與強化石'
    types: [GEM_STONE, UPGRADE_STONE, RUNE]
    keywords: [GEM, UPGRADE, RUNE]

  - id: SUPPLY
    display: '&a素材・消耗品'
    icon: BUNDLE
    description: '素材、食物、藥水與工具'
    types: [MATERIAL, FOOD, CONSUMABLE, POTION, TOOL, BLOCK, SKIN,
            MISCELLANEOUS]
    keywords: [MATERIAL, FOOD, CONSUMABLE, POTION, TOOL, BLOCK, SKIN, MISC, COIN]

  - id: QUEST
    display: '&f任務物品'
    icon: WRITTEN_BOOK
    description: '任務道具與劇情物件'
    types: [QUEST, QUEST_ITEM, KEY]
    keywords: [QUEST, KEY]
