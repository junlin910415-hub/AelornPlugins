# ═══════════════════════════════════════════════════════════════
#  別名：使用者輸入的各種寫法 → 上面的正式代號
# ═══════════════════════════════════════════════════════════════
#
#  指令與設定檔裡的階級可以寫英文同義字或中文名，
#  這張表負責把它們收斂成正式代號。查不到的字串會原樣大寫後使用，
#  因此正式代號本身不必也不需要登記在這裡。
#
#  新增一個階級時，把它的中文名與慣用英文寫法補進來，
#  /mi 指令就吃得到 —— 這在以前得改 Java 重新編譯。
#
# 沒指定階級時採用哪一級。
# 注意:這裡不能用空字串當 aliases 的鍵 —— Bukkit 的 YamlConfiguration 遇到
# 空鍵會丟 IllegalArgumentException 並讓「整份檔案」載入失敗,
# 症狀是所有階級一起消失,而錯誤訊息完全看不出兇手是誰。
default-tier: COMMON

# 採「專名」的階級：這些階級的物品名稱是兩字專名（斷罪、歸墟…），
# 詞綴不會接到名字前面 —— 專名靠簡短取得份量，前面掛「銳鋒」會把效果抵銷，
# 中文密度又高，接完常常超出快捷欄與提示框標題的寬度。
# 詞綴本身仍照常生效（數值有加、Lore 也照列），只是不寫進名字。
proper-name-tiers:
  - MYTHIC
  - VAST

aliases:
  NOVICE: STARTER
  TEST: STARTER
  新人測試: STARTER
  測試: STARTER
  優秀: UNCOMMON
  優良: UNCOMMON
  NORMAL: COMMON
  凡品: COMMON
  普通: COMMON
  稀有: RARE
  VERY_RARE: EPIC
  史詩: EPIC
  傳說: LEGENDARY
  FABLED: VAST
  浩瀚: VAST
  MYTHICAL: MYTHIC
  神話: MYTHIC
