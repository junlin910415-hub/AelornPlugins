# ── Lore 呈現 ────────────────────────────────────────────────
lore:

  # 這些屬性不進 Lore 的屬性列表。
  # 需求等級已經在「需求」區塊逐項標示 ✔／✖ 了，在屬性欄再列一次
  # 只是多佔一行，還會讓玩家以為那是一條可以疊的加成。
  hidden:
    - REQUIRED_LEVEL

  # ── 攻速文字分級 ───────────────────────────────────────────
  #
  #  武器摘要裡「攻擊速度：快速」的那個詞。門檻由高到低比對，
  #  第一個滿足的就是答案。載入時會自動重新排序，所以寫的順序不影響結果。
  #
  #  想多加一級（例如「極速」）直接補一行即可，不必改程式。
  #  整段刪掉或寫壞時沿用程式內建的四級。
  #
  attack-speed-tiers:
    - { at-least: 1.8,  name: '快速' }
    - { at-least: 1.35, name: '普通' }
    - { at-least: 0.85, name: '慢速' }
    - { at-least: -999, name: '沉重' }   # 兜底級：門檻要低到一定選得上

  # ── 代號 → 顯示名稱 ────────────────────────────────────────
  #
  #  這兩張表先前是寫死在 Java 裡的 switch，每新增一種能力或職業
  #  都得重新編譯部署。查不到的代號會原樣顯示（例如 SHOCK），
  #  這是刻意的 —— 看得見才知道漏了哪一筆。
  #
  displays:

    # 附加能力（詞綴／寶石觸發的效果）
    ability:
      BURN: '灼燒'
      FROST: '冰霜緩速'
      SHOCK: '雷擊'
      BLEED: '流血'
      HEAL: '治癒'

    # 職業。職業本身是 RPGCore 的資料（classes.yml），
    # 這裡只決定「在物品需求上怎麼寫給玩家看」。
    class:
      VANGUARD: '戰士 / 守護騎士'
      WARRIOR: '戰士 / 守護騎士'
      RANGER: '弓箭手 / 神射手'
      ARCHER: '弓箭手 / 神射手'
      HUNTER: '弓箭手 / 神射手'
      SHADOWBLADE: '刺客 / 決鬥者'
      ASSASSIN: '刺客 / 決鬥者'
      ROGUE: '刺客 / 決鬥者'
      ARCANIST: '法師 / 秘術師'
      MAGE: '法師 / 秘術師'
      WIZARD: '法師 / 秘術師'
      WARDEN: '薩滿 / 圖騰先知'
      SHAMAN: '薩滿 / 圖騰先知'
      KNIGHT: '騎士'

  # ── 版面文字 ───────────────────────────────────────────────
  #
  #  提示框裡每一行給玩家看的字都可以在這裡改，改完 /mi reload 即生效，
  #  不必重新編譯。整段是「覆寫層」：只寫你想改的鍵，
  #  沒寫的自動沿用程式內建的預設值（也就是下面註解掉的那些）。
  #
  #  ⚠ 不要把值寫成空字串來隱藏某一行 —— 空值會被當成「沒寫」而回退到預設。
  #
  #  佔位符是具名的，可以自由調換語序：
  #      '&7等級：&f{level}'  改成  '&f{level} &7級'  都可以。
  #  打錯的佔位符會原樣顯示在畫面上（例如 {levle}），這是故意的：
  #  看得見才查得到，靜靜變成空字串只會留下難追的怪 bug。
  #
  #  pages 是各分頁的標題；text 是其餘所有行。
  #
  # pages:
  #   overview: '物品總覽'
  #   offense: '攻擊與元素'
  #   attributes: '屬性與功能'
  #   survival: '生存與資源'
  #   abilities: '能力、鑲嵌與限制'
  #   story: '物品故事'
  #
  # text:
  #   page-header: '{tier} &8｜ &f{type}'
  #   page-title: '&f{title}'
  #   page-hint: ' 翻頁'
  #   level-line: '&7等級：&f{level}    &7品鑑：&f{quality}%'
  #   upgrade-line: '&7強化等級：&e+{upgrade}'
  #   trade-quote-line: '&7商店估價：&f購買 {buy} / 售出 {sell} {currency}'
  #   score-line: '&e裝備評分：&f{score} &8[&f{grade}&8]'
  #   score-breakdown-title: '&6評分構成'
  #   score-breakdown-combat: '&7傷害：&f{offense}    &7生存：&f{defense}'
  #   score-breakdown-support: '&7資源：&f{resource}    &7輔助：&f{utility}'
  #   requirement-class: '職業'
  #   requirement-level: '戰鬥等級'
  #   requirement-quest: '任務'
  #   class-any: '不限職業'
  #   class-separator: ' / '
  #   weapon-dps: '&f{dps} &7每秒傷害'
  #   weapon-attack-speed: '&7攻擊速度：&f{label} &8(&f每秒 {rate} 次&8)'
  #   weapon-damage-range: '&6傷害範圍：&f{range}'
  #   equipment-health: '&f+{value} &7生命'
  #   equipment-defense: '&f+{value} &7防禦'
  #   equipment-resistance: '&f+{value} &7抗性'
  #   empty-offense: '&8此物品沒有攻擊屬性。'
  #   empty-survival: '&8此物品沒有生存或資源屬性。'
  #   empty-story: '&8尚未有人記錄這件物品的來歷。'
  #   empty-affixes: '&8沒有額外詞綴。'
  #   affix-list: '&d附加能力：&f{affixes}'
  #   affix-separator: '、'
  #   affix-major: '&c核心詞條：&f{affix}'
  #   major-identification: '&c核心特性：&f{name}'
  #   major-identification-line: '&7{line}'
  #   ability-name: '&e特殊能力：&f{name}'
  #   ability-chance: '&7觸發機率：&f{chance}%'
  #   ability-power: '&7能力強度：&f{power}'
  #   set-name: '&b所屬套裝：&f{set}'
  #   deconstruct-yes: '&a可拆解：&f是'
  #   deconstruct-no: '&8可拆解：否'
  #   gem-slots: '&3寶石孔：&f{used}&7 / &f{total}'
  #   gem-empty: '&8尚未鑲嵌寶石。'
  #   gem-unsupported: '&8這件物品沒有寶石孔。'
  #   gem-entry: '&b◆ {gem}'
  #   rune-slots: '&6符文孔：&f{used}&7 / &f{total}'
  #   rune-empty: '&8尚未裝配符文。'
  #   rune-entry: '&6◆ {rune}'
  #   soulbound: '&c靈魂綁定：&f{owner}'
  #   tradeable: '&a交易狀態：&f可交易'
  #   catalogue-line: '&8典藏編號：{type}.{id}'

# ── 別名：舊代號自動對應到正式代號 ───────────────────────────
aliases:
  LIGHTNING_DAMAGE: THUNDER_DAMAGE
  HOLY_DAMAGE: LIGHTNESS_DAMAGE
  SHADOW_DAMAGE: DARKNESS_DAMAGE
  AIR_DAMAGE: WIND_DAMAGE
  WALK_SPEED: MOVEMENT_SPEED
  MELEE_DAMAGE: MAIN_ATTACK_DAMAGE_PERCENT
  RAW_MELEE_DAMAGE: MAIN_ATTACK_DAMAGE
  RAW_MAIN_ATTACK_DAMAGE: MAIN_ATTACK_DAMAGE
  RAW_SPELL_DAMAGE: SPELL_DAMAGE
  HEALTH: MAX_HEALTH
  HEALTH_REGEN: HEALTH_REGENERATION
  MANA_REGEN: MANA_REGENERATION
  LIFESTEAL: LIFE_STEAL
  CRITICAL_DAMAGE_BONUS: CRITICAL_STRIKE_POWER
  MAIN_ATTACK_RANGE: RANGE

# ── 中繼鍵：這些不是屬性，是物品的結構性欄位 ─────────────────
metadata-keys:
  - NAME
  - MATERIAL
  - DISPLAY
