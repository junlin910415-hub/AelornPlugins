schema-version: 1

# ===============================================================
#  艾洛恩 AELORN — 武器屬性目錄
# ===============================================================
#
#  這份檔案取代了原本寫死在 Java 裡的 WeaponStatCatalog。
#  先前新增一個屬性、改一個中文顯示名、調一個數值上限，
#  都得改程式碼重新編譯部署；現在改這裡就好。
#
#  欄位說明：
#    name      顯示名稱（Lore 與選單共用）
#    suffix    單位，例如 % 或「 格」
#    category  分類，決定 Lore 的分組與顏色
#    limit     數值安全上限，防止設定檔手滑寫出天文數字
#
#  屬性在 Lore 裡的呈現順序 = 先照分類的 order，同分類內照本檔案的
#  書寫順序。想調整某條屬性出現的位置，把它在 stats 底下搬個位置即可。
#
# ===============================================================

# ── 分類：決定 Lore 的分組、顏色與呈現先後 ─────────────────────
#
#  每個分類在 Lore 裡會長出一行標題，例如「&c✦ 攻擊」，
#  底下才是屬於它的屬性。order 小的排前面。
#
#  icon 是標題前的符號，留空字串就只顯示名稱。
#  這裡選用的符號都是本伺服器字型確定畫得出來的；
#  換符號前請先在遊戲裡確認不會變成豆腐方塊。
#
categories:
  OFFENSE:
    name: '攻擊'
    color: '&c'
    icon: '✦'
    order: 1
  DEFENSE:
    name: '防禦'
    color: '&9'
    icon: '◆'
    order: 2
  RESOURCE:
    name: '資源'
    color: '&b'
    icon: '❖'
    order: 3
  MOBILITY:
    name: '機動'
    color: '&a'
    icon: '✸'
    order: 4
  PRIMARY:
    name: '屬性'
    color: '&e'
    icon: '✧'
    order: 5
  ECONOMY:
    name: '增益'
    color: '&6'
    icon: '◈'
    order: 6

# ── 元素：每個元素自動衍生 8 條屬性 ───────────────────────────
elements:
  EARTH: { name: '大地', color: '&2' }
  THUNDER: { name: '雷霆', color: '&e' }
  WATER: { name: '流水', color: '&3' }
  FIRE: { name: '烈焰', color: '&c' }
  WIND: { name: '疾風', color: '&a' }
  ICE: { name: '冰霜', color: '&b' }
  DARKNESS: { name: '暗影', color: '&5' }
  LIGHTNESS: { name: '聖光', color: '&f' }
  ARCANE: { name: '奧術', color: '&d' }
  NATURE: { name: '自然', color: '&2' }

# 元素衍生模板；{element} 會被代換成元素名稱
element-templates:
  '_DAMAGE': { name: '{element}傷害', suffix: '', category: OFFENSE, limit: 100000 }
  '_DAMAGE_PERCENT': { name: '{element}傷害', suffix: '%', category: OFFENSE, limit: 500 }
  '_MAIN_ATTACK_DAMAGE': { name: '{element}主攻擊傷害', suffix: '', category: OFFENSE, limit: 100000 }
  '_MAIN_ATTACK_DAMAGE_PERCENT': { name: '{element}主攻擊傷害', suffix: '%', category: OFFENSE, limit: 500 }
  '_SPELL_DAMAGE': { name: '{element}法術傷害', suffix: '', category: OFFENSE, limit: 100000 }
  '_SPELL_DAMAGE_PERCENT': { name: '{element}法術傷害', suffix: '%', category: OFFENSE, limit: 500 }
  '_RESISTANCE': { name: '{element}抗性', suffix: '', category: DEFENSE, limit: 100000 }
  '_RESISTANCE_PERCENT': { name: '{element}抗性', suffix: '%', category: DEFENSE, limit: 500 }

